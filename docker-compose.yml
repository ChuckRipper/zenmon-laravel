  #     - "8001:8001"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - mysql

volumes:
  zenmon_mysql_data:
    name: zenmon_mysql_data