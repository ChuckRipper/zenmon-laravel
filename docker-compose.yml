version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: zenmon_mysql
    environment:
      MYSQL_DATABASE: zenmon_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: zenmon
      MYSQL_PASSWORD: zenmon123
    ports:
      - "3306:3306"
    volumes:
      - zenmon_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  zenmon_mysql_data: